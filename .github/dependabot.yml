version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    # Major framework/runtime migrations are deliberately selected and
    # qualified one ecosystem at a time. Do not let the routine updater force
    # React, Zod, Express, Vite, or similar major lines into a grouped PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # drizzle-zod 0.8.x targets the newer Zod type surface. Updating it in
      # isolation currently breaks the shared schema's TypeScript contract,
      # so keep routine grouped updates on the qualified 0.7 line until the
      # Zod/schema migration is handled as a dedicated change.
      - dependency-name: drizzle-zod
        versions:
          - ">=0.8.0 <1.0.0"
      # Capacitor CLI 8.5.0 currently resolves xcode/uuid versions covered by
      # GHSA-w5hq-g745-h8pq. Keep the audited 8.4.2 toolchain until a later
      # release removes that development-time dependency path.
      - dependency-name: "@capacitor/cli"
        versions:
          - "8.5.0"
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
