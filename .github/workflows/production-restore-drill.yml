name: Production restore drill

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional exact deployed commit to require
        required: false
        type: string
  schedule:
    - cron: "17 12 1 */3 *"

permissions:
  contents: read

concurrency:
  group: creativesos-production
  cancel-in-progress: false

jobs:
  restore:
    name: Restore newest production archive in an ephemeral private machine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://creativesos.net
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CREATIVESOS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      RECOVERY_MACHINE_NAME: creativesos-restore-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Prove the live release boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const response = await fetch("https://creativesos.net/api/release");
          if (!response.ok) throw new Error(`Release boundary returned ${response.status}`);
          const release = await response.json();
          if (release.status !== "verified" || release.build?.identityVerified !== true || release.build?.sourceDirty !== false || release.migrations?.parity !== true) {
            throw new Error("The deployed release is not verified, clean, and migration-complete");
          }
          const expected = process.env.CREATIVESOS_EXPECTED_COMMIT?.trim();
          if (expected && release.build.sourceCommit !== expected) {
            throw new Error(`Expected deployed commit ${expected}, received ${release.build.sourceCommit}`);
          }
          fs.writeFileSync("production-release-evidence.json", `${JSON.stringify(release, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Restore the newest archive in a private one-shot Fly Machine
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          flyctl machine run . \
            --app creatoros-app \
            --name "${RECOVERY_MACHINE_NAME}" \
            --dockerfile Dockerfile.recovery \
            --region iad \
            --vm-size shared-cpu-1x \
            --vm-memory 1024 \
            --rootfs-size 2gb \
            --restart no \
            --autostart=false \
            --autostop=off \
            --skip-dns-registration \
            --metadata purpose=production-restore-drill \
            --detach 2>&1 | tee production-restore-launch.log

          machine_id="$(flyctl machine list --app creatoros-app --json | jq -r --arg name "${RECOVERY_MACHINE_NAME}" '.[] | select(.name == $name) | .id' | head -n 1)"
          if [[ -z "${machine_id}" ]]; then
            echo "The recovery Machine could not be resolved after launch" >&2
            exit 1
          fi
          printf '%s\n' "${machine_id}" > production-restore-machine-id.txt

          stopped=false
          for _ in $(seq 1 180); do
            state="$(flyctl machine list --app creatoros-app --json | jq -r --arg id "${machine_id}" '.[] | select(.id == $id) | .state' | head -n 1)"
            case "${state}" in
              stopped)
                stopped=true
                break
                ;;
              created|starting|started|stopping)
                sleep 5
                ;;
              destroyed|destroying|"")
                echo "The recovery Machine disappeared before evidence collection" >&2
                exit 1
                ;;
              *)
                echo "Unexpected recovery Machine state: ${state}" >&2
                exit 1
                ;;
            esac
          done
          if [[ "${stopped}" != "true" ]]; then
            echo "The recovery Machine exceeded the bounded completion window" >&2
            exit 1
          fi

          evidence_line=""
          for _ in $(seq 1 10); do
            flyctl logs --app creatoros-app --machine "${machine_id}" --no-tail > production-restore-machine.log 2>&1 || true
            evidence_line="$(grep -o 'CREATIVESOS_RECOVERY_EVIDENCE={.*}' production-restore-machine.log | tail -n 1 || true)"
            if [[ -n "${evidence_line}" ]]; then
              break
            fi
            sleep 3
          done
          if [[ -z "$evidence_line" ]]; then
            echo "The ephemeral recovery machine did not emit qualification evidence" >&2
            exit 1
          fi
          EVIDENCE_LINE="${evidence_line#CREATIVESOS_RECOVERY_EVIDENCE=}" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const evidence = JSON.parse(process.env.EVIDENCE_LINE ?? "");
          if (evidence.status !== "production_restore_verified" || evidence.hashMatches !== true || evidence.manifestMatches !== true || evidence.privateSource !== true || evidence.isolatedRestore !== true || evidence.publicService !== false || evidence.orphanDirectMessages !== 0) {
            throw new Error("Production restore evidence was incomplete or invalid");
          }
          if (!Number.isInteger(evidence.migrationCount) || evidence.migrationCount < 1 || !Number.isInteger(evidence.requiredTableCount) || evidence.requiredTableCount < 1 || !Number.isInteger(evidence.rtoSeconds) || evidence.rtoSeconds < 0) {
            throw new Error("Production restore evidence did not contain usable recovery measurements");
          }
          fs.writeFileSync("production-restore-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Remove the exact recovery Machine
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          machine_id=""
          if [[ -f production-restore-machine-id.txt ]]; then
            machine_id="$(cat production-restore-machine-id.txt)"
          fi
          if [[ -z "${machine_id}" ]]; then
            machine_id="$(flyctl machine list --app creatoros-app --json | jq -r --arg name "${RECOVERY_MACHINE_NAME}" '.[] | select(.name == $name) | .id' | head -n 1)"
          fi
          if [[ -n "${machine_id}" ]]; then
            flyctl machine destroy --app creatoros-app --force "${machine_id}"
          fi
      - name: Retain secret-free recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-restore-drill-${{ github.run_id }}
          path: |
            production-release-evidence.json
            production-restore-evidence.json
            production-restore-launch.log
            production-restore-machine.log
            production-restore-machine-id.txt
          if-no-files-found: warn
          retention-days: 90
