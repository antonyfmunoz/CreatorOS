name: Production restore drill

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional exact deployed commit to require
        required: false
        type: string
  schedule:
    - cron: "17 12 1 */3 *"

permissions:
  contents: read

concurrency:
  group: creativesos-production
  cancel-in-progress: false

jobs:
  restore:
    name: Restore newest production archive in an ephemeral private machine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://creativesos.net
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CREATIVESOS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Prove the live release boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const response = await fetch("https://creativesos.net/api/release");
          if (!response.ok) throw new Error(`Release boundary returned ${response.status}`);
          const release = await response.json();
          if (release.status !== "verified" || release.build?.identityVerified !== true || release.build?.sourceDirty !== false || release.migrations?.parity !== true) {
            throw new Error("The deployed release is not verified, clean, and migration-complete");
          }
          const expected = process.env.CREATIVESOS_EXPECTED_COMMIT?.trim();
          if (expected && release.build.sourceCommit !== expected) {
            throw new Error(`Expected deployed commit ${expected}, received ${release.build.sourceCommit}`);
          }
          fs.writeFileSync("production-release-evidence.json", `${JSON.stringify(release, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Restore the newest archive in a private one-shot Fly Machine
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          flyctl machine run . \
            --app creatoros-app \
            --dockerfile Dockerfile.recovery \
            --region iad \
            --vm-size shared-cpu-1x \
            --vm-memory 1024 \
            --rootfs-size 2gb \
            --restart no \
            --autostart=false \
            --autostop=off \
            --skip-dns-registration \
            --metadata purpose=production-restore-drill \
            --rm 2>&1 | tee production-restore-run.log
          evidence_line="$(grep -o 'CREATIVESOS_RECOVERY_EVIDENCE=.*' production-restore-run.log | tail -n 1)"
          if [[ -z "$evidence_line" ]]; then
            echo "The ephemeral recovery machine did not emit qualification evidence" >&2
            exit 1
          fi
          EVIDENCE_LINE="${evidence_line#CREATIVESOS_RECOVERY_EVIDENCE=}" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const evidence = JSON.parse(process.env.EVIDENCE_LINE ?? "");
          if (evidence.status !== "production_restore_verified" || evidence.hashMatches !== true || evidence.manifestMatches !== true || evidence.privateSource !== true || evidence.isolatedRestore !== true || evidence.publicService !== false || evidence.orphanDirectMessages !== 0) {
            throw new Error("Production restore evidence was incomplete or invalid");
          }
          if (!Number.isInteger(evidence.migrationCount) || evidence.migrationCount < 1 || !Number.isInteger(evidence.requiredTableCount) || evidence.requiredTableCount < 1 || !Number.isInteger(evidence.rtoSeconds) || evidence.rtoSeconds < 0) {
            throw new Error("Production restore evidence did not contain usable recovery measurements");
          }
          fs.writeFileSync("production-restore-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Retain secret-free recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-restore-drill-${{ github.run_id }}
          path: |
            production-release-evidence.json
            production-restore-evidence.json
            production-restore-run.log
          if-no-files-found: warn
          retention-days: 90
