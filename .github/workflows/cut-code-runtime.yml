name: CutStudio code runtime

on:
  pull_request:
    paths: ["runtimes/cut-code/**", ".github/workflows/cut-code-runtime.yml"]
  push:
    branches: [main]
    paths: ["runtimes/cut-code/**", ".github/workflows/cut-code-runtime.yml"]

permissions:
  contents: read

concurrency:
  group: cut-code-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-render:
    name: Isolated TSX pixels and execution boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/cut-code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtimes/cut-code/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Install artifact inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build pinned local qualification image
        run: docker build -t creativesos-cut-code:qualification .
      - name: Prove actual output and cancellation boundaries
        run: npm run qualify
      - name: Retain synthetic artifacts and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cut-code-runtime-evidence
          path: runtimes/cut-code/qualification-output/
          retention-days: 7
          if-no-files-found: warn
