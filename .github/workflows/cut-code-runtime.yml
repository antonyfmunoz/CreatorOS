name: CutStudio code runtime

on:
  pull_request:
    paths: ["runtimes/cut-code/**", ".github/workflows/cut-code-runtime.yml"]
  push:
    branches: [main]
    paths: ["runtimes/cut-code/**", ".github/workflows/cut-code-runtime.yml"]

permissions:
  contents: read

concurrency:
  group: cut-code-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-render:
    name: Isolated TSX pixels and execution boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/cut-code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtimes/cut-code/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Install artifact inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build pinned local qualification image
        run: docker build -t creativesos-cut-code:qualification .
      - name: Prove actual output and cancellation boundaries
        run: npm run qualify
      - name: Retain synthetic artifacts and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cut-code-runtime-evidence
          path: runtimes/cut-code/qualification-output/
          retention-days: 7
          if-no-files-found: warn

  production-candidate:
    name: Candidate image pixels and vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: runtimes/cut-code
    env:
      CUT_CODE_IMAGE_VARIANT: production-candidate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtimes/cut-code/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Install artifact inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build independently maintained candidate image
        run: docker build -f Dockerfile.production -t creativesos-cut-code:production-candidate .
      - name: Prove the same pixels, audio, cancellation and isolation boundaries
        run: npm run qualify
      - name: Install checksum-pinned vulnerability scanner
        run: |
          mkdir -p "$RUNNER_TEMP/cut-trivy"
          curl --fail --location --connect-timeout 20 --max-time 120 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/cut-trivy/trivy.tar.gz"
          printf '%s  %s\n' '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' "$RUNNER_TEMP/cut-trivy/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cut-trivy/trivy.tar.gz" -C "$RUNNER_TEMP/cut-trivy" trivy
      - name: Block promotion on high or critical OS and package vulnerabilities
        run: |
          "$RUNNER_TEMP/cut-trivy/trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --timeout 10m --format json \
            --output qualification-output/production-candidate/vulnerabilities.json \
            creativesos-cut-code:production-candidate
      - name: Retain candidate evidence including unsuccessful scans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cut-code-production-candidate-evidence
          path: runtimes/cut-code/qualification-output/production-candidate/
          retention-days: 7
          if-no-files-found: warn
