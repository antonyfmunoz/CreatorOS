name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install media qualification runtime
        run: bash scripts/install-media-quality-runtime.sh
      - run: npm ci
      - name: Verify clean release source
        run: node scripts/assert-clean-source.mjs
      - run: npm run verify:secrets
      - run: npm run verify:stitch
      - run: npm run verify:infrastructure
      - run: npm run verify
      - name: Qualify generated source dependency lockfiles with the real installer
        run: npm run verify:cut-code-lockfiles
      - name: Qualify native renderer process ownership and forced shutdown
        run: npm run verify:cut-native-lifecycle
      - name: Audit production and build dependency graph
        run: npm audit --audit-level=moderate

  native-android:
    name: Android native shell
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - name: Verify install hooks preserve source
        run: node scripts/assert-clean-source.mjs
      - name: Synchronize native projects
        run: npm run mobile:sync
      - name: Verify generated native projects are reproducible
        run: node scripts/assert-clean-source.mjs
      - name: Compile unsigned Android debug shell
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  native-ios:
    name: iOS native shell
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify install hooks preserve source
        run: node scripts/assert-clean-source.mjs
      - name: Synchronize native projects
        run: npm run mobile:sync
      - name: Verify generated native projects are reproducible
        run: node scripts/assert-clean-source.mjs
      - name: Compile unsigned iOS simulator shell
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/creativesos-derived-data"
          CODE_SIGNING_ALLOWED=NO
          build

  database:
    name: Database and durable workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creativesos_qualification
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creativesos_qualification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creativesos_qualification
      QUALIFICATION_ISOLATED_DATABASE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply and qualify every migration
        run: node scripts/migrate-qualification.mjs
      - name: Qualify automation kernel
        run: npx tsx scripts/qualify-automation-kernel.ts
      - name: Qualify native social automations
        run: npx tsx scripts/qualify-native-social-automations.ts
      - name: Qualify relationship operations
        run: npx tsx scripts/qualify-relationship-operations.ts
      - name: Qualify account privacy lifecycle
        run: npx tsx scripts/qualify-account-privacy.ts
      - name: Qualify cross-machine worker lease recovery
        run: npx tsx scripts/qualify-worker-resilience.ts

  media-ingest:
    uses: ./.github/workflows/native-media-ingest.yml

  browser-project:
    name: Browser project (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chromium, desktop-chromium]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creativesos_browser
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creativesos_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creativesos_browser
      QUALIFICATION_ISOLATED_DATABASE: "true"
      CREATOROS_QUALIFICATION_MODE: "true"
      VITE_CREATOROS_QUALIFICATION_MODE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install media qualification runtime
        run: bash scripts/install-media-quality-runtime.sh
      - run: npm ci
      - run: node scripts/migrate-qualification.mjs
      - run: npx tsx scripts/seed-browser-qualification.ts
      - run: npx playwright install --with-deps chromium
      - name: Qualify isolated CutStudio animation rendering
        run: npm run verify:cut-animation
      - run: npx playwright test --project=${{ matrix.project }}
      # A retried test can pass the job and still contain essential failure
      # traces. Keep the synthetic report in both outcomes; never erase a flake
      # by treating the final green job as a clean first-attempt qualification.
      - name: Retain synthetic browser evidence including retried failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # Preserve the required branch-protection check. Neither a skipped, cancelled
  # nor failed project can make this aggregate pass. Every project's complete
  # suite remains serial against its own seeded PostgreSQL service.
  browser:
    name: Browser journeys
    needs: [browser-project, media-ingest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all browser projects to succeed
        env:
          BROWSER_RESULT: ${{ needs.browser-project.result }}
          MEDIA_INGEST_RESULT: ${{ needs.media-ingest.result }}
        run: |
          test "$BROWSER_RESULT" = success
          test "$MEDIA_INGEST_RESULT" = success
