name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creativesos_qualification
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creativesos_qualification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/creativesos_qualification
      - run: npm run verify:automations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/creativesos_qualification
      - run: npm run verify
