name: Production backup qualification

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional exact deployed commit to require
        required: false
        type: string
  schedule:
    # The daily production backup is requested at 09:17 UTC. Qualify the
    # newest completed archive one hour later every Monday.
    - cron: "17 10 * * 1"

permissions:
  contents: read

concurrency:
  group: creativesos-production-backup-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Verify newest private production backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://creativesos.net
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CREATIVESOS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Prove the live release boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const response = await fetch("https://creativesos.net/api/release");
          if (!response.ok) throw new Error(`Release boundary returned ${response.status}`);
          const release = await response.json();
          if (release.status !== "verified" || release.build?.identityVerified !== true || release.build?.sourceDirty !== false || release.migrations?.parity !== true) {
            throw new Error("The deployed release is not verified, clean, and migration-complete");
          }
          const expected = process.env.CREATIVESOS_EXPECTED_COMMIT?.trim();
          if (expected && release.build.sourceCommit !== expected) {
            throw new Error(`Expected deployed commit ${expected}, received ${release.build.sourceCommit}`);
          }
          fs.writeFileSync("production-release-evidence.json", `${JSON.stringify(release, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Verify newest private archive and durable manifest
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(flyctl ssh console --quiet --app creatoros-app --command 'node scripts/inspect-production-backup.mjs')"
          evidence_line="$(printf '%s\n' "$evidence" | tail -n 1)"
          EVIDENCE_LINE="$evidence_line" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const evidence = JSON.parse(process.env.EVIDENCE_LINE ?? "");
          if (evidence.status !== "production_backup_verified" || evidence.sizeMatches !== true || evidence.hashMatches !== true || evidence.archiveReadable !== true || evidence.privateBucket !== true) {
            throw new Error("Production backup evidence was incomplete or invalid");
          }
          if (!Number.isInteger(evidence.requiredArchiveTables) || evidence.requiredArchiveTables < 1 || !Number.isFinite(evidence.sizeBytes) || evidence.sizeBytes < 1) {
            throw new Error("Production backup evidence did not describe a usable archive");
          }
          fs.writeFileSync("production-backup-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 });
          NODE
      - name: Retain secret-free qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-backup-qualification-${{ github.run_id }}
          path: |
            production-release-evidence.json
            production-backup-evidence.json
          if-no-files-found: error
          retention-days: 90
