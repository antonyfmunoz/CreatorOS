name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to run the protected production release
        required: true
        type: string
      topology_change:
        description: Preserve live topology, or explicitly transition its paid machine layout
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - apply-scaled
          - apply-compact
      topology_confirm:
        description: For a transition, type APPLY_SCALED_TOPOLOGY or APPLY_COMPACT_TOPOLOGY
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: creativesos-production
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact release
    if: github.event.inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: creativesos_release
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creativesos_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creativesos_release
      QUALIFICATION_ISOLATED_DATABASE: "true"
      CREATOROS_QUALIFICATION_MODE: "true"
      VITE_CREATOROS_QUALIFICATION_MODE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install media qualification runtime
        run: bash scripts/install-media-quality-runtime.sh
      - run: npm ci
      - name: Verify clean release source
        run: node scripts/assert-clean-source.mjs
      - run: npm run verify:secrets
      - run: npm run verify:stitch
      - run: npm run verify:infrastructure
      - run: npm run verify
      - name: Apply and qualify the exact migration ledger
        run: node scripts/migrate-qualification.mjs
      - name: Qualify cross-machine worker lease recovery
        run: npx tsx scripts/qualify-worker-resilience.ts
      - name: Seed browser qualification
        run: npx tsx scripts/seed-browser-qualification.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop field journeys
        run: npx playwright test
      - name: Retain failed exact-release browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: exact-release-browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  deploy:
    name: Backup, migrate, deploy, and prove identity
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://creativesos.net
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      DISTRIBUTION_DISPATCH_SECRET: ${{ secrets.DISTRIBUTION_DISPATCH_SECRET }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CREATIVESOS_FLY_CONFIG: ${{ inputs.topology_change == 'apply-scaled' && 'infra/fly.production-scaled.toml' || inputs.topology_change == 'apply-compact' && 'fly.toml' || '' }}
      CREATIVESOS_TOPOLOGY_CONFIRM: ${{ inputs.topology_confirm }}
      CREATIVESOS_PRODUCTION_BASE_URL: https://creativesos.net
      CREATIVESOS_PRODUCTION_SMOKE_MODE: public
      CREATIVESOS_EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: npm ci
      - name: Execute fail-closed production release
        shell: pwsh
        run: ./scripts/deploy-production.ps1
      - name: Install production smoke browser
        run: npx playwright install --with-deps chromium
      - name: Verify exact deployed release through the public application boundary
        id: public_production_smoke
        run: npm run verify:production-smoke:public
      - name: Preserve post-deploy public smoke evidence on failure
        if: failure() && steps.public_production_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-public-smoke-evidence
          path: |
            test-results/
            production-smoke-report/
          if-no-files-found: ignore
          retention-days: 14
