<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>CreativesOS is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
      main { width: min(100%, 420px); border: 1px solid #27272a; border-radius: 24px; background: #09090b; padding: 28px; }
      p { color: #a1a1aa; }
      button { min-height: 44px; width: 100%; margin-top: 12px; border: 0; border-radius: 999px; background: #fff; color: #000; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Your private account data was not cached on this device. Reconnect to continue safely; any media already saved to your device remains available there.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
