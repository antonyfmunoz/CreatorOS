app = "creatoros-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Run the additive, advisory-lock-protected database migration before this
# release receives traffic. The migration runner establishes the verified
# legacy baseline once, then applies every later checked-in migration.
[deploy]
  release_command = "node scripts/migrate-production.mjs"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PUBLIC_APP_URL = "https://creativesos.net"
  # Clerk runtime keys are managed as Fly secrets. The public key is supplied
  # to Vite as an ephemeral deployment build argument, never committed here.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
