app = "creatoros-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node scripts/migrate-production.mjs"

[processes]
  web = "node dist/index.js"
  media = "npm run media:worker"
  cut = "npm run cut:worker"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PUBLIC_APP_URL = "https://creativesos.net"
  MEDIA_PROCESSING_MODE = "external"
  CUT_STUDIO_PROCESSING_MODE = "external"
  META_GRAPH_API_VERSION = "v25.0"

[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 2

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/api/ready"
  timeout = "5s"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["media"]
  size = "performance-2x"
  memory = "4gb"

[[vm]]
  processes = ["cut"]
  size = "performance-4x"
  memory = "8gb"
